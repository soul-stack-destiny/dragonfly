# tasks/extras.yml — host tuning that an in-memory datastore wants on any host.
#
# Transparent huge pages cause latency spikes during the fork Dragonfly uses to write a snapshot,
# so they are turned off through a small oneshot unit. Log rotation is installed because Dragonfly
# writes its own log files rather than to the journal. Kernel parameters are not guessed here:
# pass what this host needs in sysctl_settings (an empty map, the default, leaves the host alone).

- name: Render the disable-thp systemd unit
  module: core.file.rendered
  params:
    path:     /etc/systemd/system/disable-thp.service
    template: templates/disable-thp.service.tmpl
    mode:     "${ vars.unit_file_mode }"
    owner:    "${ vars.root_owner }"
    group:    "${ vars.root_group }"

# A oneshot unit that stays "active" after it has run; systemd re-reads it by itself when the
# file changed.
- name: Ensure disable-thp is running and enabled at boot
  module: core.service.running
  params:
    name:    disable-thp
    enabled: true

- name: Render the dragonfly logrotate rule
  module: core.file.rendered
  params:
    path:     /etc/logrotate.d/dragonfly
    template: templates/logrotate.tmpl
    mode:     "${ vars.unit_file_mode }"
    owner:    "${ vars.root_owner }"
    group:    "${ vars.root_group }"

# ignore_failures skips a parameter that is read-only in this environment (some values inside a
# container) instead of failing the whole run.
- name: Apply the dragonfly kernel parameters
  module: core.sysctl.applied
  params:
    filename:        30-dragonfly
    reload:          auto
    ignore_failures: true
    settings:        "${ input.sysctl_settings }"
