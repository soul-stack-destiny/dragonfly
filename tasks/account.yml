- name: Ensure the dragonfly system group exists
  module: core.group.present
  params:
    name: "${ input.group }"
    system: true

- name: Ensure the dragonfly system user exists
  module: core.user.present
  params:
    name: "${ input.user }"
    system: true
    group: "${ input.group }"
    shell: /usr/sbin/nologin

- name: Ensure the dragonfly data directory exists
  module: core.directory.present
  params:
    path:    "${ input.data_dir }"
    owner:   "${ input.user }"
    group:   "${ input.group }"
    mode:    "0750"
    parents: true

- name: Ensure the dragonfly log directory exists
  module: core.directory.present
  params:
    path:    "${ input.log_dir }"
    owner:   "${ input.user }"
    group:   "${ input.group }"
    mode:    "0750"
    parents: true

# Owned by root; the service reads its config through the group.
- name: Ensure the dragonfly config directory exists
  module: core.directory.present
  params:
    path:    "${ input.conf_dir }"
    owner:   "${ vars.root_owner }"
    group:   "${ input.group }"
    mode:    "0750"
    parents: true
