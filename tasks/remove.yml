# Teardown (ensure: absent): the install in reverse. Each step is a no-op when its target is
# already gone, so this is safe to re-run.

- name: Stop the dragonfly snapshot-prune timer
  module: core.service.stopped
  params:
    name: "${ vars.prune_service_name + '.timer' }"

- name: Disable the dragonfly snapshot-prune timer at boot
  module: core.service.disabled
  params:
    name: "${ vars.prune_service_name + '.timer' }"

- name: Stop dragonfly
  module: core.service.stopped
  params:
    name: "${ vars.service_name }"

- name: Disable dragonfly at boot
  module: core.service.disabled
  params:
    name: "${ vars.service_name }"

- name: Remove the dragonfly systemd unit
  module: core.file.absent
  register: rm_unit
  params:
    path: "${ vars.systemd_dir + '/' + vars.service_name + '.service' }"

- name: Remove the dragonfly snapshot-prune systemd unit
  module: core.file.absent
  register: rm_prune_unit
  params:
    path: "${ vars.systemd_dir + '/' + vars.prune_service_name + '.service' }"

- name: Remove the dragonfly snapshot-prune systemd timer
  module: core.file.absent
  register: rm_prune_timer
  params:
    path: "${ vars.systemd_dir + '/' + vars.prune_service_name + '.timer' }"

- name: Reload systemd after removing the dragonfly units
  module: core.exec.run
  onchanges: [rm_unit, rm_prune_unit, rm_prune_timer]
  params:
    cmd:  systemctl
    args: [daemon-reload]

- name: Remove the dragonfly binary
  module: core.file.absent
  params:
    path: "${ vars.bin_path }"

- name: Remove the dragonfly environment file
  module: core.file.absent
  params:
    path: "${ vars.env_path }"

- name: Remove the dragonfly flagfile
  module: core.file.absent
  params:
    path: "${ vars.config_path }"

- name: Remove the dragonfly ACL file
  module: core.file.absent
  params:
    path: "${ vars.acl_path }"

# Removed even with TLS off now: an earlier run may have written them.
- name: Remove the dragonfly TLS certificate
  module: core.file.absent
  params:
    path: "${ vars.tls_cert_path }"

- name: Remove the dragonfly TLS private key
  module: core.file.absent
  params:
    path: "${ vars.tls_key_path }"

- name: Remove the dragonfly TLS CA certificate
  module: core.file.absent
  params:
    path: "${ vars.tls_ca_path }"

- name: Remove the dragonfly TLS directory
  module: core.directory.absent
  params:
    path: "${ vars.tls_dir }"

- name: Remove the dragonfly config directory
  module: core.directory.absent
  params:
    path: "${ input.conf_dir }"

# disable-thp stays: other services on the host may rely on it.
- name: Remove the dragonfly logrotate rule
  module: core.file.absent
  params:
    path: /etc/logrotate.d/dragonfly

- name: Remove the dragonfly kernel parameter file
  module: core.file.absent
  params:
    path: /etc/sysctl.d/30-dragonfly.conf

# Data and logs are deleted only with purge_data.
- name: Purge the dragonfly data directory
  module: core.directory.absent
  when: "input.purge_data"
  params:
    path:      "${ input.data_dir }"
    recursive: true

- name: Purge the dragonfly log directory
  module: core.directory.absent
  when: "input.purge_data"
  params:
    path:      "${ input.log_dir }"
    recursive: true

- name: Remove the dragonfly user
  module: core.user.absent
  params:
    name: "${ input.user }"

- name: Remove the dragonfly group
  module: core.group.absent
  params:
    name: "${ input.group }"
