service_name: dragonfly
prune_service_name: dragonfly-snapshot-prune

# Release archives use uname names (x86_64/aarch64); an unknown arch gives an empty suffix and
# the download fails.
arch_suffix: >-
  ${ has(soulprint.self.os) && has(soulprint.self.os.arch)
       ? (soulprint.self.os.arch == 'amd64' ? 'x86_64'
          : (soulprint.self.os.arch == 'arm64' ? 'aarch64' : ''))
       : '' }

tarball_path: "${ '/tmp/dragonfly-' + input.version + '.tar.gz' }"
extract_dir:  "${ '/tmp/dragonfly-' + input.version }"
src_bin: "${ vars.extract_dir + '/dragonfly-' + vars.arch_suffix }"
bin_path: "${ input.bin_dir + '/dragonfly' }"

config_path: "${ input.conf_dir + '/dragonfly.conf' }"
acl_path:    "${ input.conf_dir + '/users.acl' }"
env_path:    /etc/default/dragonfly

# No password means an open instance (allow_unauthenticated) and no ACL file at all.
acl_enabled: "${ input.password != '' }"
admin_account_enabled: "${ input.admin_password != '' }"
admin_perms: "~* &* +@all"

tls_enabled: "${ has(input.tls) && has(input.tls.enable) && input.tls.enable }"
tls_ca_enabled: "${ vars.tls_enabled && has(input.tls.ca_ref) && input.tls.ca_ref != '' }"
tls_dir:       "${ input.conf_dir + '/tls' }"
tls_cert_path: "${ input.conf_dir + '/tls/dragonfly.crt' }"
tls_key_path:  "${ input.conf_dir + '/tls/dragonfly.key' }"
tls_ca_path:   "${ input.conf_dir + '/tls/ca.crt' }"

# Bind the primary IP by default instead of every interface; loopback if the host has none.
listen_host: >-
  ${ input.host != ''
       ? input.host
       : (has(soulprint.self.network) && has(soulprint.self.network.primary_ip)
            && soulprint.self.network.primary_ip != ''
          ? soulprint.self.network.primary_ip
          : '127.0.0.1') }

# The console serves /metrics without a password, so it stays on loopback unless asked.
console_enabled:     "${ input.admin_port != 0 }"
console_listen_host: "${ input.admin_bind != '' ? input.admin_bind : '127.0.0.1' }"
readiness_url: >-
  ${ 'http://' + vars.console_listen_host + ':' + string(input.admin_port) + '/metrics' }

snapshot_remote:  "${ input.snapshot_uri != '' }"
snapshot_dir_eff: "${ input.snapshot_uri != '' ? input.snapshot_uri : input.data_dir }"

s3_enabled:      "${ vars.snapshot_remote && input.snapshot_uri.startsWith('s3://') }"
s3_endpoint:     "${ has(input.snapshot_s3) && has(input.snapshot_s3.endpoint) ? input.snapshot_s3.endpoint : '' }"
s3_use_https:    "${ !has(input.snapshot_s3) || !has(input.snapshot_s3.use_https) || input.snapshot_s3.use_https }"
s3_sign_payload: "${ !has(input.snapshot_s3) || !has(input.snapshot_s3.sign_payload) || input.snapshot_s3.sign_payload }"
s3_ec2_metadata: "${ has(input.snapshot_s3) && has(input.snapshot_s3.ec2_metadata) && input.snapshot_s3.ec2_metadata }"
s3_access_key:   "${ has(input.snapshot_s3) && has(input.snapshot_s3.access_key) ? input.snapshot_s3.access_key : '' }"
s3_secret_key:   "${ has(input.snapshot_s3) && has(input.snapshot_s3.secret_key) ? input.snapshot_s3.secret_key : '' }"
s3_region:       "${ has(input.snapshot_s3) && has(input.snapshot_s3.region) ? input.snapshot_s3.region : '' }"

prune_enabled: "${ input.snapshot_retention_days > 0 }"

config_file_mode: "0640"
env_file_mode: "0600"
pem_mode: "0600"
unit_file_mode: "0644"

systemd_dir: /etc/systemd/system
root_owner:  root
root_group:  "${ vars.root_owner }"
