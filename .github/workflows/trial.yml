# Build soul-trial and soul-lint from the core and run the render tests. The core's release
# tag is older than this destiny's input format, hence main.
name: trial

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  l0:
    name: Render tests (hermetic, no docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the dragonfly destiny
        uses: actions/checkout@v7
        with:
          path: dragonfly # the directory name must be the destiny name

      - name: Checkout soul-stack (the toolchain source)
        uses: actions/checkout@v7
        with:
          repository: souls-guild/soul-stack
          ref: main
          path: soul-stack

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: soul-stack/keeper/go.mod
          # No Go code in this repo: key the cache off the core's go.sum.
          cache-dependency-path: soul-stack/keeper/go.sum

      - name: Build the toolchain from the core
        working-directory: soul-stack
        run: |
          go build -o "$GITHUB_WORKSPACE/bin/soul-trial" ./keeper/cmd/soul-trial
          go build -o "$GITHUB_WORKSPACE/bin/soul-lint" ./soul-lint/cmd/soul-lint

      - name: Validate the manifests
        run: |
          "$GITHUB_WORKSPACE/bin/soul-lint" validate-destiny  dragonfly/destiny.yml
          "$GITHUB_WORKSPACE/bin/soul-lint" validate-service  dragonfly/_trial/service.yml
          "$GITHUB_WORKSPACE/bin/soul-lint" validate-scenario --service-name dragonfly dragonfly/_trial/scenario/apply/main.yml

      - name: Run the render tests
        run: |
          "$GITHUB_WORKSPACE/bin/soul-trial" run dragonfly/_trial
