# The two system accounts.
#
# This is the shape the `redis` unit uses, and the reason `default` is not simply an admin here:
#   default       — what applications connect as. It gets every key and channel and every ordinary
#                   command, but not the administrative and dangerous ones;
#   default_admin — the operator's account, with everything.
#
# The administrative account exists only when a password was given for it, and its name is the
# caller's choice. What this case pins down is that both accounts, their passwords and the
# permission rules actually reach the ACL template — the render context of that file is the only
# place a render-only suite can see it, since the suite never executes a template.
name: dragonfly renders the default and administrative accounts into the ACL file

fixtures:
  default_destiny_source: "file://../../{name}"
  input:
    version: "1.39.0"
    password: "trial-password"
    admin_password: "trial-admin-password"
  soulprint:
    os:
      arch: amd64
    network:
      primary_ip: 10.0.0.5

assert:
  task_present:
    # The ACL file is root-owned and group-readable by the service: it holds password hashes.
    - module: core.file.rendered
      params_subset:
        path: /etc/dragonfly/users.acl
        template_content: "<present>"
        mode: "0640"
        owner: root
        group: dragonfly
        render_context:
          vars:
            admin_account_enabled: true
            admin_perms: "~* &* +@all"
          input:
            ensure: present
            purge_data: false
            version: "1.39.0"
            sha256: ""
            base_url: https://github.com/dragonflydb/dragonfly/releases/download
            allow_private: false
            bin_dir: /usr/local/bin
            user: dragonfly
            group: dragonfly
            conf_dir: /etc/dragonfly
            data_dir: /var/lib/dragonfly
            log_dir: /var/log/dragonfly
            host: ""
            port: 6379
            http_console: false
            admin_port: 6380
            admin_bind: ""
            maxclients: 64000
            maxmemory: ""
            proactor_threads: 0
            cache_mode: false
            snapshot_cron: ""
            dbfilename: dump
            snapshot_retention_days: 0
            snapshot_uri: ""
            snapshot_s3: {}
            password: trial-password
            default_perms: "~* &* +@all -@admin -@dangerous"
            admin_user: default_admin
            admin_password: trial-admin-password
            users: {}
            allow_unauthenticated: false
            tls: {}
            tls_replication: false
            replica_of: ""
            master_user: ""
            master_auth: ""
            extra_flags: {}
            extra_env: {}
            sysctl_settings: {}
            version_check: false
            wait_ready: true
          self:
            sid: trial-host
            covens: []
            choirs: []
            traits: {}
            role: ""
            os:
              arch: amd64
            network:
              primary_ip: 10.0.0.5
          role: ""

    # The environment file carries the `default` password and nothing else: Dragonfly needs it
    # there to accept a TLS configuration at all, while the administrative account lives only in
    # the ACL file.
    - module: core.file.rendered
      params_subset:
        path: /etc/default/dragonfly
        mode: "0600"
        owner: root
        group: root
