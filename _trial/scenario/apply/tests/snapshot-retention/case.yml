# Scheduled snapshots with a retention, on a host that keeps every one of them.
#
# This is the backup shape: Dragonfly holds its dataset in memory, so the snapshot set under the
# data directory is the only thing on the host worth copying anywhere. Two knobs decide what that
# directory looks like:
#   - snapshot_cron turns snapshotting on at all (without it, a restart loses everything since
#     the last save someone asked for over the wire);
#   - dbfilename decides whether each snapshot replaces the previous one (the unit's default) or
#     is written as a new set of files, which is what a {timestamp}-style name does.
#
# The second shape grows without limit — Dragonfly never removes an old snapshot — so this case
# also asks for a retention, and asserts the timer that enforces it.
name: dragonfly renders scheduled snapshots with a retention timer

fixtures:
  default_destiny_source: "file://../../{name}"
  input:
    version: "1.39.0"
    password: "trial-password"
    snapshot_cron: "0 * * * *"
    dbfilename: "dump-{timestamp}"
    snapshot_retention_days: 7
    data_dir: /srv/dragonfly/snapshots
    sysctl_settings: { net.core.somaxconn: "1024", vm.overcommit_memory: "1" }
  soulprint:
    os:
      arch: amd64
    network:
      primary_ip: 10.0.0.5

assert:
  task_present:
    # The snapshot directory is wherever the caller put it — its own volume, here.
    - module: core.directory.present
      params_subset:
        path: /srv/dragonfly/snapshots
        owner: dragonfly
        group: dragonfly
        mode: "0750"
        parents: true

    # The pruning pair: a oneshot unit and the timer that runs it.
    - module: core.file.rendered
      params_subset:
        path: /etc/systemd/system/dragonfly-snapshot-prune.service
        template_content: "<present>"
        mode: "0644"
        owner: root
        group: root

    - module: core.file.rendered
      params_subset:
        path: /etc/systemd/system/dragonfly-snapshot-prune.timer
        template_content: "<present>"
        mode: "0644"

    # The timer is what is enabled; the service it triggers is never enabled on its own.
    - module: core.service.running
      params_subset:
        name: dragonfly-snapshot-prune.timer
        enabled: true

    # The kernel parameters reach the sysctl step as given.
    - module: core.sysctl.applied
      params_subset:
        filename: 30-dragonfly
        settings: { net.core.somaxconn: "1024", vm.overcommit_memory: "1" }
