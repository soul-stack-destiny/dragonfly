# TLS without a way to authenticate is refused at render time.
#
# Dragonfly will not start with TLS enabled and no authentication configured — and an ACL file
# does not count for that check, only a password or client certificates do. Left to itself, that
# is a service that installs cleanly and then fails to come up.
#
# Here the caller asked for TLS on an instance it also declared open, so the refusal happens
# while the plan is built, with a message that says which of the two to fix.
name: dragonfly refuses TLS on an instance with no password and no client certificates

fixtures:
  default_destiny_source: "file://../../{name}"
  vault:
    secret/dragonfly/tls:
      cert: "-----BEGIN CERTIFICATE-----\ntrial-cert\n-----END CERTIFICATE-----"
      key: "-----BEGIN PRIVATE KEY-----\ntrial-key\n-----END PRIVATE KEY-----"
  input:
    version: "1.39.0"
    allow_unauthenticated: true
    tls:
      enable: true
      cert_ref: "secret/dragonfly/tls#cert"
      key_ref: "secret/dragonfly/tls#key"
  soulprint:
    os:
      arch: amd64
    network:
      primary_ip: 10.0.0.5

expect_render_error: "tls.enable requires either a password or tls.ca_ref"
