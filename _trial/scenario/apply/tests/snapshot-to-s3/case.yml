# Snapshots written straight to object storage, on S3-compatible storage with an explicit key
# pair.
#
# Dragonfly uses one setting for both writing and loading snapshots, so pointing it at a bucket
# makes that bucket the source of truth: the instance loads from there at startup and refuses to
# come up if it cannot list it. That is worth knowing when reading this case — the local data
# directory is still created and is still the process's working directory, it just holds no
# snapshot.
#
# What this case pins down:
#   - the bucket URI replaces the local path in the flagfile, while the data directory is still
#     created (the unit does not stop managing the host just because the snapshots left it);
#   - the endpoint and the transport switches reach the flagfile;
#   - the credentials do NOT: they have no flags at all in Dragonfly, so they go into the 0600
#     root-only environment file as the AWS variables, which is also the only channel that keeps
#     them off a command line.
name: dragonfly renders snapshots written to S3-compatible object storage

fixtures:
  default_destiny_source: "file://../../{name}"
  input:
    version: "1.39.0"
    password: "trial-password"
    snapshot_cron: "*/15 * * * *"
    dbfilename: "dump-{timestamp}"
    snapshot_uri: "s3://backups-trial/dragonfly/prod"
    snapshot_s3:
      endpoint: "minio.internal:9000"
      use_https: false
      region: "eu-central-1"
      access_key: "trial-access-key"
      secret_key: "trial-secret-key"
  soulprint:
    os:
      arch: amd64
    network:
      primary_ip: 10.0.0.5

assert:
  task_present:
    # The local data directory is still created: it stays the working directory, and dropping it
    # would break the sandbox's writable path.
    - module: core.directory.present
      params_subset:
        path: /var/lib/dragonfly
        owner: dragonfly
        group: dragonfly
        mode: "0750"

    # The flagfile, rendered against the context that carries the bucket and the transport
    # switches. The credentials are deliberately absent from these vars — they are not in this
    # file at all.
    - module: core.file.rendered
      params_subset:
        path: /etc/dragonfly/dragonfly.conf
        template_content: "<present>"
        render_context:
          vars:
            listen_host: 10.0.0.5
            console_enabled: true
            console_listen_host: 127.0.0.1
            acl_enabled: true
            acl_path: /etc/dragonfly/users.acl
            tls_enabled: false
            tls_ca_enabled: false
            tls_cert_path: /etc/dragonfly/tls/dragonfly.crt
            tls_key_path: /etc/dragonfly/tls/dragonfly.key
            tls_ca_path: /etc/dragonfly/tls/ca.crt
            snapshot_remote: true
            snapshot_dir_eff: "s3://backups-trial/dragonfly/prod"
            s3_enabled: true
            s3_endpoint: "minio.internal:9000"
            s3_use_https: false
            s3_sign_payload: true
            s3_ec2_metadata: false
          input:
            ensure: present
            purge_data: false
            version: "1.39.0"
            sha256: ""
            base_url: https://github.com/dragonflydb/dragonfly/releases/download
            allow_private: false
            bin_dir: /usr/local/bin
            user: dragonfly
            group: dragonfly
            conf_dir: /etc/dragonfly
            data_dir: /var/lib/dragonfly
            log_dir: /var/log/dragonfly
            host: ""
            port: 6379
            http_console: false
            admin_port: 6380
            admin_bind: ""
            maxclients: 64000
            maxmemory: ""
            proactor_threads: 0
            cache_mode: false
            snapshot_cron: "*/15 * * * *"
            dbfilename: "dump-{timestamp}"
            snapshot_retention_days: 0
            snapshot_uri: "s3://backups-trial/dragonfly/prod"
            snapshot_s3:
              endpoint: "minio.internal:9000"
              use_https: false
              region: "eu-central-1"
              access_key: trial-access-key
              secret_key: trial-secret-key
            password: trial-password
            default_perms: "~* &* +@all -@admin -@dangerous"
            admin_user: default_admin
            admin_password: ""
            users: {}
            allow_unauthenticated: false
            tls: {}
            tls_replication: false
            replica_of: ""
            master_user: ""
            master_auth: ""
            extra_flags: {}
            extra_env: {}
            sysctl_settings: {}
            version_check: false
            wait_ready: true
          self:
            sid: trial-host
            covens: []
            choirs: []
            traits: {}
            role: ""
            os:
              arch: amd64
            network:
              primary_ip: 10.0.0.5
          role: ""

    # The credentials reach the environment file — 0600, root-only, never a command line.
    - module: core.file.rendered
      params_subset:
        path: /etc/default/dragonfly
        template_content: "<present>"
        mode: "0600"
        owner: root
        group: root

  task_absent:
    # No retention timer: pruning runs `find` over a local directory and cannot reach a bucket,
    # so the contract refuses the combination outright rather than installing a timer that would
    # look like a policy and delete nothing.
    - module: core.file.rendered
      params_subset:
        path: /etc/systemd/system/dragonfly-snapshot-prune.timer
