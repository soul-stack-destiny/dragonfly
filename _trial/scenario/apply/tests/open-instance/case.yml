name: dragonfly renders an acknowledged unauthenticated instance with no ACL file and no readiness wait

fixtures:
  default_destiny_source: "file://../../{name}"
  input:
    version: "1.39.0"
    allow_unauthenticated: true
    host: "127.0.0.1"
    admin_port: 0
  soulprint:
    os:
      arch: amd64
    network:
      primary_ip: 10.0.0.5

assert:
  task_present:
    - module: core.service.running
      params_subset:
        name: dragonfly
        enabled: true

    - module: core.file.rendered
      params_subset:
        path: /etc/default/dragonfly
        mode: "0600"
        owner: root
        group: root

  task_absent:
    - module: core.file.rendered
      params_subset:
        path: /etc/dragonfly/users.acl
    - module: core.http.probe
