name: dragonfly renders an arm64 upgrade fetched from an internal mirror

fixtures:
  default_destiny_source: "file://../../{name}"
  input:
    version: "1.40.0"
    sha256: "sha256:3333333333333333333333333333333333333333333333333333333333333333"
    base_url: "https://mirror.internal/dragonfly/releases/download"
    allow_private: true
    password: "trial-password"
  soulprint:
    os:
      arch: arm64
    network:
      primary_ip: 10.0.0.9

assert:
  task_present:
    - module: core.url.fetched
      params_subset:
        url: https://mirror.internal/dragonfly/releases/download/v1.40.0/dragonfly-aarch64.tar.gz
        path: /tmp/dragonfly-1.40.0.tar.gz
        checksum: "sha256:3333333333333333333333333333333333333333333333333333333333333333"
        allow_private: true

    - module: core.archive.extracted
      params_subset:
        path: /tmp/dragonfly-1.40.0.tar.gz
        dest: /tmp/dragonfly-1.40.0

    - module: core.file.present
      params_subset:
        path: /usr/local/bin/dragonfly
        src: /tmp/dragonfly-1.40.0/dragonfly-aarch64
        mode: "0755"

    - module: core.service.restarted
      params_subset:
        name: dragonfly

    - module: core.http.probe
      params_subset:
        url: http://127.0.0.1:6380/metrics
