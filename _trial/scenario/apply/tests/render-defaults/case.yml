# The default install, rendered.
#
# Hermetic and render-only: it checks the plan the unit expands into, not a running Dragonfly.
# Nothing is downloaded and the file templates are not executed here — the runner substitutes
# their content and hands the render context along.
#
# What this case pins down:
#   - the tarball URL carries the machine architecture in uname spelling and no version, while
#     the release path does carry it;
#   - the account is a real system user (the snapshots need a stable uid), and it owns the data
#     and log directories;
#   - the flagfile and the ACL file are 0640 root:dragonfly while the password goes into a 0600
#     root-only environment file;
#   - the service is enabled, a restart is wired reactively, and readiness is polled on the
#     console port, which defaults to loopback;
#   - with no retention asked for, no pruning steps exist at all.
name: dragonfly renders the fetch/account/install/config/unit/service plan with defaults

fixtures:
  default_destiny_source: "file://../../{name}"
  input:
    version: "1.39.0"
    # Optional, but set here: with a hash the download is verified before it is published.
    sha256: "sha256:1111111111111111111111111111111111111111111111111111111111111111"
    password: "trial-password"
  # The synthetic host: its architecture picks the release artifact, its primary IP is the bind
  # address.
  soulprint:
    os:
      arch: amd64
    network:
      primary_ip: 10.0.0.5

assert:
  task_present:
    # ── install.yml ────────────────────────────────────────────────────────────
    - module: core.url.fetched
      params_subset:
        url: https://github.com/dragonflydb/dragonfly/releases/download/v1.39.0/dragonfly-x86_64.tar.gz
        path: /tmp/dragonfly-1.39.0.tar.gz
        checksum: "sha256:1111111111111111111111111111111111111111111111111111111111111111"
        mode: "0644"
        allow_private: false

    - module: core.archive.extracted
      params_subset:
        path: /tmp/dragonfly-1.39.0.tar.gz
        dest: /tmp/dragonfly-1.39.0

    # ── account.yml ────────────────────────────────────────────────────────────
    - module: core.group.present
      params_subset:
        name: dragonfly
        system: true

    - module: core.user.present
      params_subset:
        name: dragonfly
        system: true
        group: dragonfly
        shell: /usr/sbin/nologin

    # The snapshot directory — the one thing on this host worth backing up.
    - module: core.directory.present
      params_subset:
        path: /var/lib/dragonfly
        owner: dragonfly
        group: dragonfly
        mode: "0750"
        parents: true

    - module: core.directory.present
      params_subset:
        path: /var/log/dragonfly
        owner: dragonfly
        mode: "0750"

    # The config directory is root-owned, group-readable by the service.
    - module: core.directory.present
      params_subset:
        path: /etc/dragonfly
        owner: root
        group: dragonfly
        mode: "0750"

    # ── service.yml ────────────────────────────────────────────────────────────
    # The binary comes out of the unpacked archive, where its name carries the architecture.
    - module: core.file.present
      params_subset:
        path: /usr/local/bin/dragonfly
        src: /tmp/dragonfly-1.39.0/dragonfly-x86_64
        mode: "0755"
        owner: root
        group: root

    # The ACL file: password hashes, readable by the service through its group.
    - module: core.file.rendered
      params_subset:
        path: /etc/dragonfly/users.acl
        template_content: "<present>"
        mode: "0640"
        owner: root
        group: dragonfly

    - module: core.file.rendered
      params_subset:
        path: /etc/dragonfly/dragonfly.conf
        template_content: "<present>"
        mode: "0640"
        owner: root
        group: dragonfly

    # The password lives here, in a 0600 root-only file, and nowhere else in plaintext.
    - module: core.file.rendered
      params_subset:
        path: /etc/default/dragonfly
        template_content: "<present>"
        mode: "0600"
        owner: root
        group: root

    - module: core.file.rendered
      params_subset:
        path: /etc/systemd/system/dragonfly.service
        template_content: "<present>"
        mode: "0644"
        owner: root
        group: root

    - module: core.service.running
      params_subset:
        name: dragonfly
        enabled: true

    - module: core.service.restarted
      params_subset:
        name: dragonfly

    # Readiness on the console port, which is loopback unless the caller says otherwise.
    - module: core.http.probe
      params_subset:
        url: http://127.0.0.1:6380/metrics
        method: GET
        status_codes: [200]
        allow_http: true
        allow_private: true

    # ── extras.yml ─────────────────────────────────────────────────────────────
    - module: core.file.rendered
      params_subset:
        path: /etc/systemd/system/disable-thp.service
        template_content: "<present>"

    - module: core.service.running
      params_subset:
        name: disable-thp
        enabled: true

    - module: core.file.rendered
      params_subset:
        path: /etc/logrotate.d/dragonfly
        template_content: "<present>"

    # No kernel parameters were asked for, so the step carries an empty set.
    - module: core.sysctl.applied
      params_subset:
        filename: 30-dragonfly
        reload: auto
        ignore_failures: true
        settings: {}

  task_absent:
    # No TLS configured → no PEM files and no TLS directory.
    - module: core.directory.present
      params_subset:
        path: /etc/dragonfly/tls
    # No retention asked for → the whole pruning group is missing from the plan, not merely
    # skipped at run time.
    - module: core.file.rendered
      params_subset:
        path: /etc/systemd/system/dragonfly-snapshot-prune.service
    - module: core.file.rendered
      params_subset:
        path: /etc/systemd/system/dragonfly-snapshot-prune.timer
    # Teardown steps belong to the other branch of the lifecycle.
    - module: core.service.stopped
    - module: core.user.absent
    - module: core.directory.absent
