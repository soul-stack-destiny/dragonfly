name: dragonfly refuses a local retention policy for snapshots kept in object storage

fixtures:
  default_destiny_source: "file://../../{name}"
  input:
    version: "1.39.0"
    password: "trial-password"
    snapshot_cron: "0 * * * *"
    snapshot_uri: "s3://backups-trial/dragonfly/prod"
    snapshot_retention_days: 7
  soulprint:
    os:
      arch: amd64
    network:
      primary_ip: 10.0.0.5

expect_render_error: "cannot reach an object store"
